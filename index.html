function MessagesPage({ matchId }) {
  const {
    currentUser, navigate, myMatchIds, allProfiles, messages, sendMessage,
    markConversationRead, sessionId, blockProfile, reportProfile, showToast,
  } = useApp();
  const [draft, setDraft] = useState('');
  const [mobileListOpen, setMobileListOpen] = useState(!matchId);
  const scrollRef = useRef(null);

  useEffect(() => { if (!currentUser) navigate('#/login'); }, [currentUser, navigate]);

  const conversations = useMemo(() => {
    if (!currentUser) return [];
    return myMatchIds.map(m => {
      const profile = allProfiles.find(p => p.id === m.otherId);
      const conv = messages.filter(x => x.matchId === m.matchId).sort((a,b) => a.ts - b.ts);
      const last = conv[conv.length - 1];
      const unread = conv.filter(x => x.toId === sessionId && !x.read).length;
      return { ...m, profile, conv, last, unread };
    }).filter(c => c.profile)
      .sort((a,b) => (b.last?.ts || b.ts) - (a.last?.ts || a.ts));
  }, [myMatchIds, allProfiles, messages, sessionId, currentUser]);

  const active = conversations.find(c => c.matchId === matchId) || (matchId ? null : conversations[0]);

  useEffect(() => {
    if (active) markConversationRead(active.matchId, sessionId);
  }, [active?.matchId, active?.conv?.length, sessionId, markConversationRead]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [active?.conv?.length, active?.matchId]);

  if (!currentUser) return null;

  const send = () => {
    if (!draft.trim() || !active) return;
    sendMessage(active.matchId, active.profile.id, draft);
    setDraft('');
  };

  if (conversations.length === 0) {
    return (
      <div className="mx-auto max-w-3xl px-4 py-16 sm:px-6">
        <Card className="p-10">
          <EmptyState
            title="No conversations yet"
            body="You can message members once you have matched. Head to Discover and like a few profiles."
            cta="Discover members" onClick={() => navigate('#/discover')} />
        </Card>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-7xl px-0 sm:px-6 lg:px-8 py-0 sm:py-8">
      <div className="overflow-hidden sm:rounded-3xl border-y sm:border border-rose-soft/70 bg-white shadow-soft"
        style={{ height:'calc(100vh - 68px)' }}>
        <div className="grid h-full lg:grid-cols-[340px_1fr]">

          {/* Conversation list */}
          <aside className={`${mobileListOpen ? 'block' : 'hidden'} lg:block h-full overflow-y-auto border-r border-rose-soft/70`}>
            <div className="sticky top-0 z-10 border-b border-rose-soft/70 bg-white/96 px-5 py-4 backdrop-blur">
              <h1 className="font-display text-[22px] text-burgundy">Messages</h1>
              <p className="mt-0.5 text-[12px] text-charcoal-mute">
                {conversations.reduce((n,c) => n + c.unread, 0)} unread
              </p>
            </div>
            {conversations.map(c => (
              <button key={c.matchId}
                onClick={() => { navigate('#/messages/' + c.matchId); setMobileListOpen(false); }}
                className={`flex w-full items-center gap-3.5 border-b border-rose-soft/50 px-5 py-4 text-left transition ${active?.matchId === c.matchId ? 'bg-burgundy/6' : 'hover:bg-ivory'}`}>
                <div className="relative shrink-0">
                  <Avatar name={c.profile.name} hue={c.profile.hue} size={48} src={c.profile.photos?.[0]} />
                  {c.profile.lastActive !== undefined && c.profile.lastActive <= 6 && c.profile.privacy?.showOnline !== false && (
                    <span className="absolute -bottom-0.5 -right-0.5 h-3.5 w-3.5 rounded-full bg-emerald-500 ring-2 ring-white" />
                  )}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center justify-between gap-2">
                    <p className={`truncate text-[14px] ${c.unread ? 'font-bold text-charcoal' : 'font-semibold text-charcoal-soft'}`}>
                      {c.profile.name}
                    </p>
                    <span className="shrink-0 text-[11px] text-charcoal-mute">
                      {c.last ? fmtTime(c.last.ts) : ''}
                    </span>
                  </div>
                  <div className="mt-0.5 flex items-center justify-between gap-2">
                    <p className={`truncate text-[12.5px] ${c.unread ? 'font-semibold text-charcoal' : 'text-charcoal-mute'}`}>
                      {c.last ? (c.last.fromId === sessionId ? 'You: ' : '') + c.last.text : 'You matched — say hello.'}
                    </p>
                    {c.unread > 0 && (
                      <span className="flex h-5 min-w-[20px] shrink-0 items-center justify-center rounded-full bg-burgundy px-1.5 text-[10px] font-bold text-white">
                        {c.unread}
                      </span>
                    )}
                  </div>
                </div>
              </button>
            ))}
          </aside>

          {/* Chat pane */}
          <section className={`${mobileListOpen ? 'hidden' : 'flex'} lg:flex h-full flex-col`}>
            {active ? (
              <>
                <header className="flex items-center gap-3 border-b border-rose-soft/70 bg-white px-4 py-3.5 sm:px-5">
                  <button onClick={() => setMobileListOpen(true)} className="rounded-full p-1.5 text-charcoal-mute hover:bg-charcoal/5 lg:hidden" aria-label="Back to conversations">
                    <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M19 12H5M11 18l-6-6 6-6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                  <button onClick={() => navigate('#/profile/' + active.profile.id)} className="flex min-w-0 flex-1 items-center gap-3 text-left">
                    <Avatar name={active.profile.name} hue={active.profile.hue} size={42} src={active.profile.photos?.[0]} />
                    <div className="min-w-0">
                      <p className="flex items-center gap-1.5 truncate text-[14.5px] font-semibold text-charcoal">
                        {active.profile.name}
                        {active.profile.verified && <VerifiedTick size={13} />}
                      </p>
                      <p className="truncate text-[11.5px] text-charcoal-mute">
                        {active.profile.demo ? 'Demo profile — automated, will not reply' : `${active.profile.city}, ${active.profile.country}`}
                      </p>
                    </div>
                  </button>
                  <button
                    onClick={() => { if (confirm(`Block ${active.profile.name}?`)) { blockProfile(active.profile.id); navigate('#/messages'); } }}
                    className="rounded-full p-2 text-charcoal-mute transition hover:bg-red-50 hover:text-red-600" aria-label="Block member">
                    <svg viewBox="0 0 24 24" className="h-4.5 w-4.5" fill="none" stroke="currentColor" strokeWidth="1.9"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
                  </button>
                </header>

                <div ref={scrollRef} className="flex-1 overflow-y-auto bg-ivory px-4 py-5 sm:px-6">
                  <div className="mx-auto max-w-2xl">
                    <div className="mb-6 rounded-2xl border border-gold/40 bg-gold/8 px-4 py-3.5 text-center">
                      <p className="text-[11.5px] font-bold uppercase tracking-wider text-[#8A6D2A]">You matched</p>
                      <p className="mt-1 text-[12.5px] text-[#7A5E20]">
                        You and {active.profile.name} liked each other {timeAgo(active.ts)}. Be respectful and take your time.
                      </p>
                    </div>

                    {active.conv.map((m, i) => {
                      const mine = m.fromId === sessionId;
                      const prev = active.conv[i-1];
                      const showAvatar = !mine && (!prev || prev.fromId !== m.fromId);
                      return (
                        <div key={m.id} className={`flex ${mine ? 'justify-end' : 'justify-start'} ${prev && prev.fromId === m.fromId ? 'mt-1' : 'mt-4'}`}>

                            {!mine && (
                              showAvatar
                                ? <Avatar name={active.profile.name} hue={active.profile.hue} size={30} src={active.profile.photos?.[0]} />
                                : <span className="w-[30px] shrink-0" />

                            <div>
                              <div className={`rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed ${mine ? 'bg-burgundy text-white rounded-br-md' : 'bg-white text-charcoal border border-rose-soft/70 rounded-bl-md'}`}>

                              </p>

                          </div>

                    {active.profile.demo && (
                      <div className="mt-6 rounded-2xl border border-dashed border-rose-soft bg-white px-4 py-4 text-center">

                </div>

                <footer className="border-t border-rose-soft/70 bg-white px-4 py-3.5 sm:px-5">
                  <div className="mx-auto flex max-w-2xl items-end gap-2.5">
                    <button
                      onClick={() => alert('Image sharing integration point.\n\nImages must be validated for type and size, scanned for prohibited content, and stored in Supabase Storage / Firebase Storage / Cloudinary. Moderation queue required before delivery.')}
                      className="shrink-0 rounded-full p-2.5 text-charcoal-mute transition hover:bg-burgundy/6 hover:text-burgundy" aria-label="Attach image">
                      <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="1.9">
                        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5-9 9" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </button>
                    <textarea
                      value={draft} onChange={e => setDraft(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                      rows={1} placeholder={`Message ${active.profile.name}…`}
                      className="max-h-32 min-h-[46px] flex-1 resize-none rounded-2xl border border-rose-soft bg-ivory px-4 py-3 text-[14px] text-charcoal placeholder-charcoal-mute/60 transition focus:border-burgundy focus:bg-white focus:ring-4 focus:ring-burgundy/8" />

function SettingsPage() {
  const { currentUser, updateUser, navigate, showToast, plans, deleteAccount } = useApp();
  const fileRef = useRef(null);
  const [tab, setTab] = useState('profile');

  useEffect(() => { if (!currentUser) navigate('#/login'); }, [currentUser, navigate]);
  if (!currentUser) return null;

  const set = (k, v) => updateUser({ [k]: v });

  const handleUpload = (e) => {
    const files = Array.from(e.target.files || []);
    const max = currentUser.membership === 'free' ? 3 : 8;
    const existing = currentUser.photos || [];
    const remaining = max - existing.length;
    if (remaining <= 0) { showToast(`Your plan allows up to ${max} photographs.`, 'error'); return; }
    const next = [...existing];
    files.slice(0, remaining).forEach(file => {
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) { showToast('Only JPEG, PNG, WebP, or GIF images are allowed.', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { showToast('Images must be smaller than 5MB.', 'error'); return; }
      const reader = new FileReader();
      reader.onload = ev => set('photos', [...(currentUser.photos || []), ev.target.result]);
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

function VerificationPage() {
  const { currentUser, updateUser, navigate, showToast } = useApp();
  const [method, setMethod] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => { if (!currentUser) navigate('#/login'); }, [currentUser, navigate]);
  if (!currentUser) return null;

  const status = currentUser.verificationStatus || 'none';

  const submit = () => {
    if (!method) return;
    setBusy(true);
    setTimeout(() => {
      updateUser({ verificationStatus:'pending' });
      setBusy(false);
      showToast('Verification submitted. We will review it within 24 hours.');
    }, 800);
  };

  return (
    <div className="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <p className="text-[11.5px] font-bold uppercase tracking-[0.16em] text-gold">Trust</p>
      <h1 className="mt-2.5 font-display text-[30px] leading-tight text-burgundy sm:text-[36px]">Profile verification</h1>
      <p className="mt-3 text-[14.5px] leading-relaxed text-charcoal-soft">
        Verification shows other members that you are a real person. Verified profiles receive significantly
        more genuine interest — and it takes about a minute.
      </p>

      {/* Status */}
      <Card className="mt-7 p-6">
        <div className="flex items-start gap-4">
          <span className={`flex h-12 w-12 shrink-0 items-center justify-center rounded-full ${
            status === 'verified' ? 'bg-emerald-50' : status === 'pending' ? 'bg-gold/15' : 'bg-charcoal/5'}`}>
            {status === 'verified' ? (
              <svg viewBox="0 0 24 24" className="h-6 w-6 text-emerald-600" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            ) : status === 'pending' ? (
              <svg viewBox="0 0 24 24" className="h-6 w-6 text-gold" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" strokeLinecap="round"/></svg>
            ) : (
              <svg viewBox="0 0 24 24" className="h-6 w-6 text-charcoal-mute" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1" strokeLinecap="round"/></svg>
            )}
          </span>
          <div>
            <h2 className="font-display text-[21px] text-burgundy">
              {status === 'verified' ? 'Your profile is verified' : status === 'pending' ? 'Verification in review' : 'Your profile is not verified'}
            </h2>
            <p className="mt-1.5 text-[13.5px] leading-relaxed text-charcoal-soft">
              {status === 'verified'
                ? 'Other members can see your verification badge. Thank you for helping keep MY TOM genuine.'
                : status === 'pending'
                ? 'Our team is reviewing your submission. This usually takes less than 24 hours.'
                : 'Choose a verification method below to get started.'}
            </p>
          </div>
        </div>
      </Card>

      {status === 'none' && (
        <>
          <div className="mt-6 space-y-3">
            {[
              { v:'photo', l:'Photo verification', d:'Take a photo holding a handwritten note with today\'s date and the word MY TOM. Our team compares it to your profile photographs.', time:'~1 minute' },

          </div>

          <Button size="lg" className="mt-6 w-full" disabled={!method || busy} onClick={submit}>
            {busy ? 'Submitting…' : 'Submit for verification'}

            <p className="text-[12px] leading-relaxed text-charcoal-mute">

            </p>
          </div>
        </>
      )}

      {status === 'pending' && (
        <Card className="mt-6 p-6">
          <p className="text-[13.5px] leading-relaxed text-charcoal-soft">
            You will receive a notification as soon as your verification is reviewed. If you have any questions,
            please visit our <button onClick={() => navigate('#/help')} className="font-semibold text-burgundy underline">Help Centre</button>.
          </p>
        </Card>
      )}
    </div>
  );
}

      </Card>
    </div>
  );
}

                          <div className="flex flex-wrap items-center gap-2">
                            <Badge tone={r.status === 'pending' ? 'gold' : 'green'}>
                              {r.status === 'pending' ? 'Pending review' : 'Resolved'}
                            </Badge>
                            <span className="text-[12px] text-charcoal-mute">{timeAgo(r.ts)}</span>
                          </div>
                          <p className="mt-2.5 text-[14px] font-semibold text-charcoal">{r.reason}</p>
                          {r.detail && <p className="mt-1.5 text-[13px] leading-relaxed text-charcoal-soft">{r.detail}</p>}
                          <p className="mt-2.5 text-[12px] text-charcoal-mute">
                            Reported member: <strong className="font-semibold text-charcoal">{target?.name || 'Unknown'}</strong>
                            {' · '}Reported by: <strong className="font-semibold text-charcoal">{reporter?.name || 'Unknown'}</strong>
                          </p>
                        </div>
                        {r.status === 'pending' && (
                          <div className="flex flex-wrap gap-2">
                            <Button size="sm" variant="outline"
                              onClick={() => { setReports(prev => prev.map(x => x.id === r.id ? { ...x, status:'resolved', action:'No action' } : x)); showToast('Report dismissed.'); }}>
                              Dismiss
                            </Button>
                            <Button size="sm" variant="outline"
                              onClick={() => {
                                setUsers(prev => prev.map(u => u.id === r.targetId ? { ...u, suspended:true, online:false } : u));
                                setReports(prev => prev.map(x => x.id === r.id ? { ...x, status:'resolved', action:'Suspended' } : x));
                                showToast('Member suspended.');
                              }}>
                              Suspend
                            </Button>
                            <Button size="sm" variant="danger"
                              onClick={() => {
                                if (!confirm('Permanently ban this member? This cannot be undone.')) return;
                                setUsers(prev => prev.filter(u => u.id !== r.targetId));
                                setReports(prev => prev.map(x => x.id === r.id ? { ...x, status:'resolved', action:'Banned' } : x));
                                showToast('Member removed.');
                              }}>
                              Ban
                            </Button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </Card>

          <Card className="mt-5 border-burgundy/25 bg-burgundy/4 p-6">
            <h2 className="font-display text-[19px] text-burgundy">Privacy note for administrators</h2>
            <p className="mt-2 text-[13px] leading-relaxed text-charcoal-soft">
              Private member messages are not exposed in this dashboard by default. Any exceptional access
              to message content must follow a documented, lawful, privacy-conscious process — for example
              in response to a valid legal request, or where there is a credible risk to life — and every
              access is recorded in the audit log.
            </p>
          </Card>
        </div>
      )}

      {tab === 'members' && (
        <Card className="mt-7 p-6">
          <h2 className="font-display text-[20px] text-burgundy">Registered members</h2>
          {realMembers.length === 0 ? (
            <EmptyState title="No members yet"
              body="Registered members will appear here with their plan, verification status, and account state." />
          ) : (
            <div className="mt-5 overflow-x-auto">
              <table className="w-full min-w-[720px] text-left">
                <thead>
                  <tr className="border-b border-rose-soft/70">
                    {['Member','Location','Plan','Verification','Status','Joined','Actions'].map(h => (
                      <th key={h} className="pb-3 pr-4 text-[11px] font-bold uppercase tracking-wider text-charcoal-mute">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-rose-soft/50">
                  {realMembers.map(u => (
                    <tr key={u.id} className="text-[13px]">
                      <td className="py-3.5 pr-4">
                        <div className="flex items-center gap-2.5">
                          <Avatar name={u.name} hue={u.hue || 340} size={32} src={u.photos?.[0]} />
                          <div>
                            <p className="font-semibold text-charcoal">{u.name}</p>
                            <p className="text-[11.5px] text-charcoal-mute">{u.email}</p>
                          </div>
                        </div>
                      </td>
                      <td className="py-3.5 pr-4 text-charcoal-soft">{u.city}, {u.country}</td>
                      <td className="py-3.5 pr-4">
                        <Badge tone={u.membership === 'vip' ? 'gold' : u.membership === 'premium' ? 'burgundy' : 'outline'}>
                          {u.membership}
                        </Badge>
                      </td>
                      <td className="py-3.5 pr-4">
                        {u.verified ? <Badge tone="green">Verified</Badge> : <Badge tone="outline">Unverified</Badge>}
                      </td>
                      <td className="py-3.5 pr-4">
                        {u.suspended ? <Badge tone="gold">Suspended</Badge> : <Badge tone="green">Active</Badge>}
                      </td>
                      <td className="py-3.5 pr-4 text-charcoal-mute">{new Date(u.createdAt).toLocaleDateString()}</td>
                      <td className="py-3.5">
                        <div className="flex gap-1.5">
                          <button
                            onClick={() => {
                              setUsers(prev => prev.map(x => x.id === u.id ? { ...x, suspended: !x.suspended } : x));
                              showToast(u.suspended ? 'Member reinstated.' : 'Member suspended.');
                            }}
                            className="rounded-lg border border-rose-soft px-2.5 py-1 text-[11px] font-semibold text-charcoal-soft hover:border-burgundy/40">
                            {u.suspended ? 'Reinstate' : 'Suspend'}
                          </button>
                          <button
                            onClick={() => { if (confirm(`Permanently remove ${u.name}?`)) { setUsers(prev => prev.filter(x => x.id !== u.id)); showToast('Member removed.'); } }}
                            className="rounded-lg border border-red-200 px-2.5 py-1 text-[11px] font-semibold text-red-600 hover:bg-red-50">
                            Ban
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      )}

      {tab === 'plans' && (
        <div className="mt-7">
          <Card className="p-6">
            <h2 className="font-display text-[20px] text-burgundy">Membership plans</h2>
            <p className="mt-2 text-[13px] text-charcoal-soft">
              Prices and features are fully configurable. Changes take effect immediately across the platform.
            </p>

            <div className="mt-5 space-y-4">
              {plans.map(plan => (
                <div key={plan.id} className="rounded-2xl border border-rose-soft/70 p-5">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p className="font-display text-[19px] text-burgundy">{plan.name}</p>
                      <p className="mt-0.5 text-[12.5px] text-charcoal-mute">{plan.tagline}</p>
                    </div>
                    <div className="flex items-center gap-2.5">
                      <span className="text-[13px] font-semibold text-charcoal">$</span>
                      <input type="number" min="0" step="0.01" value={plan.price}
                        onChange={e => setPlans(prev => prev.map(p => p.id === plan.id ? { ...p, price: Math.max(0, +e.target.value) } : p))}
                        className="w-24 rounded-lg border border-rose-soft px-3 py-2 text-[13px] focus:border-burgundy" />
                      <span className="text-[12.5px] text-charcoal-mute">/{plan.period}</span>
                    </div>
                  </div>
                  <div className="mt-4 flex flex-wrap gap-1.5">
                    {plan.features.map(f => (
                      <span key={f} className="rounded-full bg-burgundy/7 px-2.5 py-1 text-[11px] font-medium text-burgundy">{f}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <Button className="mt-5" onClick={() => showToast('Plan configuration saved.')}>Save plan configuration</Button>
          </Card>
        </div>
      )}

      {tab === 'content' && (
        <div className="mt-7 grid gap-6 lg:grid-cols-2">
          <Card className="p-6">
            <h2 className="font-display text-[20px] text-burgundy">Site settings</h2>
            <div className="mt-5 space-y-4">
              <Input label="Site name" value={settings.siteName} onChange={e => setSettings(s => ({ ...s, siteName: e.target.value }))} />
              <Textarea label="Homepage announcement" rows={3} value={settings.announcement}
                onChange={e => setSettings(s => ({ ...s, announcement: e.target.value }))}
                hint="Leave blank to hide the announcement banner." />
              <div className="divide-y divide-rose-soft/60 border-y border-rose-soft/60">
                <Toggle label="Allow new registrations" description="Turn off to pause all new sign-ups."
                  checked={settings.allowRegistrations} onChange={v => setSettings(s => ({ ...s, allowRegistrations:v }))} />
                <Toggle label="Require verification to message" description="Only verified members can start conversations."
                  checked={settings.requireVerification} onChange={v => setSettings(s => ({ ...s, requireVerification:v }))} />
                <Toggle label="Maintenance mode" description="Show a maintenance notice instead of the homepage."
                  checked={settings.maintenanceMode} onChange={v => setSettings(s => ({ ...s, maintenanceMode:v }))} />
              </div>
              <Button onClick={() => showToast('Settings saved.')}>Save settings</Button>
            </div>
          </Card>

          <Card className="p-6">
            <h2 className="font-display text-[20px] text-burgundy">Publish an announcement</h2>
            <p className="mt-2 text-[13px] text-charcoal-soft">
              Send a notification to all members. Use sparingly.
            </p>
            <div className="mt-5 space-y-4">
              <Textarea label="Message" rows={3} id="announce-input" placeholder="Write your announcement…" />
              <Button onClick={() => {
                const el = document.getElementById('announce-input');
                const text = el?.value?.trim();
                if (!text) { showToast('Please write a message first.', 'error'); return; }
                users.forEach(u => addNotif(u.id, 'security', text));
                if (el) el.value = '';
                showToast(`Announcement sent to ${users.length} members.`);
              }}>
                Send to all members
              </Button>
            </div>

            <div className="mt-7 border-t border-rose-soft/70 pt-6">
              <h3 className="font-display text-[18px] text-burgundy">Support requests</h3>
              <p className="mt-2 text-[12.5px] text-charcoal-soft">
                Member support requests submitted through the Contact page appear here with a ticket
                reference, status, and assigned administrator. Integrate a helpdesk provider to enable
                two-way replies.
              </p>
            </div>
          </Card>
        </div>
      )}

      {tab === 'audit' && (
        <Card className="mt-7 p-6">
          <h2 className="font-display text-[20px] text-burgundy">Audit log</h2>
          <p className="mt-2 text-[13px] text-charcoal-soft">
            Every administrative action is recorded with the actor, the action, the target, and the timestamp.
          </p>
          <div className="mt-5 rounded-2xl border border-rose-soft/70 bg-ivory p-5">
            <p className="text-[12.5px] leading-relaxed text-charcoal-mute">
              In this prototype, audit entries are displayed for actions taken during your session.
              In production, the audit log is append-only, stored server-side, and cannot be edited or
              deleted by any administrator.
            </p>
          </div>
          <div className="mt-5 divide-y divide-rose-soft/60">
            {[
              { a:'Administrator signed in', t:'Just now', by: currentUser.name },
              { a:'Moderation queue viewed', t:'Just now', by: currentUser.name },
              { a:'Member directory viewed', t:'Just now', by: currentUser.name },
            ].map((e, i) => (
              <div key={i} className="flex flex-wrap items-center justify-between gap-3 py-3.5">
                <div>
                  <p className="text-[13.5px] font-semibold text-charcoal">{e.a}</p>
                  <p className="mt-0.5 text-[12px] text-charcoal-mute">by {e.by}</p>
                </div>
                <span className="text-[11.5px] text-charcoal-mute">{e.t}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   27. 404
   ═══════════════════════════════════════════════════════════════ */

function NotFoundPage() {
  const { navigate } = useApp();
  return (
    <div className="mx-auto max-w-lg px-4 py-24 text-center">
      <p className="font-display text-[72px] leading-none text-rose-soft">404</p>
      <h1 className="mt-4 font-display text-[28px] text-burgundy">This page could not be found</h1>
      <p className="mt-3 text-[14.5px] leading-relaxed text-charcoal-soft">
        The page you are looking for may have been moved or no longer exists.
      </p>
      <div className="mt-7 flex flex-wrap justify-center gap-2.5">
        <Button onClick={() => navigate('#/')}>Return home</Button>
        <Button variant="outline" onClick={() => navigate('#/discover')}>Discover members</Button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   28. MOUNT
   ═══════════════════════════════════════════════════════════════ */

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
