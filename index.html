const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function calcAge(dob) {
  const d = new Date(dob); if (isNaN(d)) return null;
  const t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a;
}

function timeAgo(ts) {
  if (!ts) return 'a while ago';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 604800) return Math.floor(s/86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function activeLabel(hours) {
  if (hours === undefined || hours === null) return null;
  if (hours <= 6) return { text:'Active today', tone:'green' };
  if (hours <= 48) return { text:'Active recently', tone:'gold' };
  return null;
}

function initials(name) {
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function gradFor(hue) {
  return `linear-gradient(140deg, hsl(${hue} 58% 74%), hsl(${(hue+38)%360} 46% 44%))`;
}

/* Compatibility scoring — transparent, deterministic, explainable */
function compatibility(me, other) {
  let score = 40;
  const reasons = [];

  if (me && other) {
    // Shared interests (max +22)
    const shared = (me.interests||[]).filter(i => (other.interests||[]).includes(i));
    if (shared.length) {
      score += Math.min(22, shared.length * 6);
      reasons.push(`${shared.length} shared interest${shared.length>1?'s':''}: ${shared.slice(0,3).join(', ')}`);
    }

    // Age preference alignment (max +16)
    const min = me.prefAgeMin ?? 18, max = me.prefAgeMax ?? 99;
    if (other.age >= min && other.age <= max) {
      score += 16;
      reasons.push('Within your preferred age range');
    } else {
      score -= 12;
      reasons.push('Outside your stated age range');
    }

    // Relationship goals (max +16)
    const goalOverlap = (me.goals||[]).filter(g => (other.goals||[]).includes(g));
    if (goalOverlap.length) {
      score += Math.min(16, goalOverlap.length * 9);
      reasons.push(`Aligned on ${goalOverlap[0].toLowerCase()}`);
    }

    // Location (max +12)
    if (me.city && other.city && me.city.toLowerCase() === other.city.toLowerCase()) {
      score += 12; reasons.push('Same city');
    } else if (me.country && other.country && me.country === other.country) {
      score += 7; reasons.push('Same country');
    }

    // Verification (+4)
    if (other.verified) { score += 4; reasons.push('Verified profile'); }
  }

  return { score: Math.max(5, Math.min(99, Math.round(score))), reasons };
}

            <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12" strokeLinecap="round"/></svg>
          </button>
        </div>
        <div className="px-5 py-5">{children}</div>
      </div>
    </div>
  );
}

function DemoNotice({ className = '' }) {

/* ═══════════════════════════════════════════════════════════════
   7. ROOT APP — STATE, PERSISTENCE, ROUTING
   ═══════════════════════════════════════════════════════════════ */

function App() {
  const [users, setUsers]         = useState(() => Store.read(K.users, []));
  const [sessionId, setSessionId] = useState(() => Store.read(K.session, null));
  const [likes, setLikes]         = useState(() => Store.read(K.likes, []));
  const [matches, setMatches]     = useState(() => Store.read(K.matches, []));
  const [messages, setMessages]   = useState(() => Store.read(K.messages, []));
  const [reports, setReports]     = useState(() => Store.read(K.reports, []));
  const [notifs, setNotifs]       = useState(() => Store.read(K.notifs, []));
  const [plans, setPlans]         = useState(() => Store.read(K.plans, DEFAULT_PLANS));
  const [settings, setSettings]   = useState(() => Store.read(K.settings, {
    siteName:'MY TOM', allowRegistrations:true, requireVerification:false,
    announcement:'', maintenanceMode:false,
  }));
  const [toast, setToast]         = useState(null);
  const [route, setRoute]         = useState(() => window.location.hash || '#/');

  // Persist everything
  useEffect(()=>Store.write(K.users, users), [users]);
  useEffect(()=>Store.write(K.session, sessionId), [sessionId]);
  useEffect(()=>Store.write(K.likes, likes), [likes]);
  useEffect(()=>Store.write(K.matches, matches), [matches]);
  useEffect(()=>Store.write(K.messages, messages), [messages]);
  useEffect(()=>Store.write(K.reports, reports), [reports]);
  useEffect(()=>Store.write(K.notifs, notifs), [notifs]);
  useEffect(()=>Store.write(K.plans, plans), [plans]);
  useEffect(()=>Store.write(K.settings, settings), [settings]);

  // Routing
  useEffect(() => {
    const onHash = () => { setRoute(window.location.hash || '#/'); window.scrollTo({ top:0, behavior:'instant' }); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = useCallback((path) => {
    if (window.location.hash === path) { window.scrollTo({top:0,behavior:'smooth'}); return; }
    window.location.hash = path;
  }, []);

  const showToast = useCallback((message, tone='success') => {
    setToast({ message, tone, id: Date.now() });
    setTimeout(() => setToast(null), 3400);
  }, []);

  const currentUser = useMemo(() => users.find(u => u.id === sessionId) || null, [users, sessionId]);

  /* ── All discoverable profiles = real users + demo profiles ── */
  const allProfiles = useMemo(() => {
    const real = users
      .filter(u => u.profileComplete && u.id !== sessionId)
      .map(u => ({ ...u, demo:false }));
    return [...real, ...DEMO_PROFILES];
  }, [users, sessionId]);

  /* ── AUTH ACTIONS ── */
  const register = useCallback((data) => {
    const age = calcAge(data.dob);
    if (age === null) return { error:'Please enter a valid date of birth.' };
    if (age < 18) return { error:'You must be at least 18 years old to join MY TOM.' };
    if (age > 110) return { error:'Please enter a valid date of birth.' };
    if (users.some(u => u.email.toLowerCase() === data.email.toLowerCase()))
      return { error:'An account with that email already exists.' };

    const user = {
      id: uid('u'),
      email: data.email.trim(),
      password: data.password,           // NOTE: prototype only. Production → Supabase Auth / bcrypt.
      name: data.name.trim(),
      dob: data.dob,
      age,
      gender: data.gender,
      interestedIn: data.interestedIn,
      country: data.country,
      city: data.city.trim(),
      goals: data.goals || [],
      bio:'', occupation:'', interests:[], photos:[],
      prefAgeMin: data.gender === 'woman' ? 21 : 30,
      prefAgeMax: data.gender === 'woman' ? 40 : 60,
      verified:false, verificationStatus:'none',
      profileComplete:false,
      membership:'free',
      role:'member',
      online:true,
      lastActive:0,
      createdAt: Date.now(),
      privacy: {
        showOnline:true, showInDiscover:true, showAge:true,
        allowMessagesFrom:'matches', hideFromSearch:false, readReceipts:true,
      },
      notifications: { matches:true, likes:true, messages:true, marketing:false, email:true },
      twoFactor:false,
    };
    setUsers(prev => [...prev, user]);
    setSessionId(user.id);
    addNotif(user.id, 'security', 'Welcome to MY TOM. Complete your profile to start meeting people.');
    return { user };
  }, [users]);

  const login = useCallback((email, password) => {
    const u = users.find(x => x.email.toLowerCase() === email.trim().toLowerCase());
    if (!u) return { error:'No account found with that email address.' };
    if (u.password !== password) return { error:'Incorrect password. Please try again.' };
    if (u.suspended) return { error:'This account has been suspended. Please contact support.' };
    setUsers(prev => prev.map(x => x.id === u.id ? { ...x, lastActive:0, online:true } : x));
    setSessionId(u.id);
    return { user:u };
  }, [users]);

  const logout = useCallback(() => {
    setUsers(prev => prev.map(x => x.id === sessionId ? { ...x, online:false, lastActive:0 } : x));
    setSessionId(null);
    navigate('#/');
  }, [sessionId, navigate]);

  const updateUser = useCallback((patch) => {
    setUsers(prev => prev.map(u => u.id === sessionId ? { ...u, ...patch, age: patch.dob ? calcAge(patch.dob) : u.age } : u));
  }, [sessionId]);

  const deleteAccount = useCallback((userId) => {
    setUsers(prev => prev.filter(u => u.id !== userId));
    setMatches(prev => prev.filter(m => m.a !== userId && m.b !== userId));
    setMessages(prev => prev.filter(m => m.fromId !== userId && m.toId !== userId));
    setLikes(prev => prev.filter(l => l.from !== userId && l.to !== userId));
    setNotifs(prev => prev.filter(n => n.userId !== userId));
    if (userId === sessionId) { setSessionId(null); navigate('#/'); }
  }, [sessionId, navigate]);

  /* ── NOTIFICATIONS ── */
  const addNotif = useCallback((userId, type, text) => {
    setNotifs(prev => [{ id: uid('n'), userId, type, text, ts: Date.now(), read:false }, ...prev].slice(0, 300));
  }, []);

  const markNotifsRead = useCallback((userId) => {
    setNotifs(prev => prev.map(n => n.userId === userId ? { ...n, read:true } : n));
  }, []);

  /* ── LIKES / PASSES / FAVOURITES / MATCHES ── */
  const likeProfile = useCallback((targetId, type = 'like') => {
    if (!currentUser) return { error:'Please sign in.' };
    if (targetId === currentUser.id) return { error:'You cannot like your own profile.' };

    const existing = likes.find(l => l.from === currentUser.id && l.to === targetId);
    if (existing && existing.type === type) return { ok:true, duplicate:true };

    setLikes(prev => [...prev.filter(l => !(l.from === currentUser.id && l.to === targetId)),
      { id: uid('l'), from: currentUser.id, to: targetId, type, ts: Date.now() }]);

    if (type === 'like') {
      const reciprocal = likes.find(l => l.from === targetId && l.to === currentUser.id && l.type === 'like');
      if (reciprocal) {
        const exists = matches.some(m =>
          (m.a === currentUser.id && m.b === targetId) || (m.a === targetId && m.b === currentUser.id));
        if (!exists) {
          const match = { id: uid('match'), a: currentUser.id, b: targetId, ts: Date.now(), seen:false };
          setMatches(prev => [...prev, match]);
          const otherName = DEMO_PROFILES.find(p => p.id === targetId)?.name || 'someone';
          addNotif(currentUser.id, 'match', `It's a match! You and ${otherName} liked each other.`);
          showToast(`It's a match with ${otherName}! 💫`, 'match');
          return { ok:true, matched:true, match };
        }
      }
    }
    return { ok:true };
  }, [currentUser, likes, matches, addNotif, showToast]);

  const undoLike = useCallback((targetId) => {
    setLikes(prev => prev.filter(l => !(l.from === sessionId && l.to === targetId)));
  }, [sessionId]);

  const myMatchIds = useMemo(() => {
    if (!currentUser) return [];
    return matches
      .filter(m => m.a === currentUser.id || m.b === currentUser.id)
      .map(m => ({ matchId: m.id, otherId: m.a === currentUser.id ? m.b : m.a, ts: m.ts }))
      .sort((x,y) => y.ts - x.ts);
  }, [matches, currentUser]);

  /* ── MESSAGING ── */
  const sendMessage = useCallback((matchId, toId, text) => {
    if (!currentUser || !text.trim()) return;
    const msg = { id: uid('msg'), matchId, fromId: currentUser.id, toId, text: text.trim(), ts: Date.now(), read:false };
    setMessages(prev => [...prev, msg]);
    setMatches(prev => prev.map(m => m.id === matchId ? { ...m, lastMessage: msg.ts } : m));
    return msg;
  }, [currentUser]);

  const markConversationRead = useCallback((matchId, readerId) => {
    setMessages(prev => prev.map(m => (m.matchId === matchId && m.toId === readerId && !m.read) ? { ...m, read:true } : m));
  }, []);

  /* ── REPORTS ── */
  const reportProfile = useCallback((targetId, reason, detail) => {
    if (!currentUser) return;
    setReports(prev => [...prev, {
      id: uid('rep'), reporterId: currentUser.id, targetId, reason, detail,
      ts: Date.now(), status:'pending'
    }]);
    showToast('Thank you. Our safety team will review this report.', 'success');
  }, [currentUser, showToast]);

  const blockProfile = useCallback((targetId) => {
    if (!currentUser) return;
    updateUser({ blocked: [...(currentUser.blocked || []), targetId] });
    setMatches(prev => prev.filter(m => !((m.a === currentUser.id && m.b === targetId) || (m.b === currentUser.id && m.a === targetId))));
    showToast('Member blocked. They can no longer see or contact you.');
  }, [currentUser, updateUser, showToast]);

  /* ── DEMO ACCOUNT SEED (for testing the full journey) ── */
  const signInAsDemo = useCallback(() => {
    const DEMO_ID = 'demo-account-sarah';
    let existing = users.find(u => u.id === DEMO_ID);

    if (!existing) {
      existing = {
        id: DEMO_ID,
        email:'sarah.demo@mytom.example',
        password:'demo1234',
        name:'Sarah', dob:'1979-04-12', age: calcAge('1979-04-12'),
        gender:'woman', interestedIn:'man',
        country:'United Kingdom', city:'London',
        goals:['Long-term Relationship','Romance & Companionship'],
        bio:'Interior designer, mother of two grown children, and a hopeless optimist about people. I like long dinners, coastal walks, and men who are curious about the world.',
        occupation:'Interior Designer',
        interests:['Art & Galleries','Travel','Fine Dining','Literature','Yoga'],
        photos:[], prefAgeMin:24, prefAgeMax:38,
        verified:true, verificationStatus:'verified', profileComplete:true,
        membership:'premium', role:'member', online:true, lastActive:0, createdAt: Date.now(),
        privacy:{ showOnline:true, showInDiscover:true, showAge:true, allowMessagesFrom:'matches', hideFromSearch:false, readReceipts:true },
        notifications:{ matches:true, likes:true, messages:true, marketing:false, email:true },
        twoFactor:false,
        __isDemoAccount:true,
      };
      setUsers(prev => [...prev, existing]);
    }

    setSessionId(DEMO_ID);

    // Seed two matches with conversations so the full journey is testable
    const seedMatches = [
      { otherId:'demo-m1', name:'Liam', msgs:[
        { from:'them', text:'Your profile made me smile — the coastal walks line especially. Which coast?' },
        { from:'me',   text:'Cornwall, mostly. I go down whenever the city gets too loud. You?' },
        { from:'them', text:'I grew up near Brighton. I cook, so if you ever want a proper dinner, I would like to earn that.' },
      ]},
      { otherId:'demo-m5', name:'Noah', msgs:[
        { from:'them', text:'Hello Sarah. I read that you are an interior designer — I would genuinely love to hear how you think about a room.' },
        { from:'me',   text:'That is a very good opening line. Most people ask what my favourite colour is.' },
      ]},
    ];

    setMatches(prev => {
      const next = [...prev];
      seedMatches.forEach((sm, i) => {
        const exists = next.some(m => (m.a === DEMO_ID && m.b === sm.otherId) || (m.b === DEMO_ID && m.a === sm.otherId));
        if (!exists) next.push({ id:'demo-match-'+i, a: DEMO_ID, b: sm.otherId, ts: Date.now() - (i+1)*3600000, seen:true });
      });
      return next;
    });

    setMessages(prev => {
      const next = [...prev];
      seedMatches.forEach((sm, i) => {
        sm.msgs.forEach((m, j) => {
          const id = `demo-msg-${i}-${j}`;
          if (!next.some(x => x.id === id)) {
            next.push({
              id, matchId:'demo-match-'+i,
              fromId: m.from === 'me' ? DEMO_ID : sm.otherId,
              toId:   m.from === 'me' ? sm.otherId : DEMO_ID,
              text: m.text,
              ts: Date.now() - (i+1)*3600000 + j*600000,
              read:true,
            });
          }
        });
      });
      return next;
    });

    setLikes(prev => {
      const next = [...prev];
      seedMatches.forEach(sm => {
        if (!next.some(l => l.from === sm.otherId && l.to === DEMO_ID)) {
          next.push({ id: uid('l'), from: sm.otherId, to: DEMO_ID, type:'like', ts: Date.now() - 7200000 });
        }
        if (!next.some(l => l.from === DEMO_ID && l.to === sm.otherId)) {
          next.push({ id: uid('l'), from: DEMO_ID, to: sm.otherId, type:'like', ts: Date.now() - 7200000 });
        }
      });
      // A couple of incoming likes to populate the Likes page
      ['demo-m2','demo-m7'].forEach(id => {
        if (!next.some(l => l.from === id && l.to === DEMO_ID)) {
          next.push({ id: uid('l'), from: id, to: DEMO_ID, type:'like', ts: Date.now() - 1800000 });
        }
      });
      return next;
    });

    return existing;
  }, [users]);

  /* ── Derived: current user's likes & favourites ── */
  const myLikes      = useMemo(() => likes.filter(l => l.from === sessionId && l.type === 'like').map(l => l.to), [likes, sessionId]);
  const myPasses     = useMemo(() => likes.filter(l => l.from === sessionId && l.type === 'pass').map(l => l.to), [likes, sessionId]);
  const myFavourites = useMemo(() => likes.filter(l => l.from === sessionId && l.type === 'favorite').map(l => l.to), [likes, sessionId]);
  const likesMe      = useMemo(() => likes.filter(l => l.to === sessionId && l.type === 'like').map(l => l.from), [likes, sessionId]);
  const myNotifs     = useMemo(() => notifs.filter(n => n.userId === sessionId), [notifs, sessionId]);
  const unreadNotifs = myNotifs.filter(n => !n.read).length;

  const unreadMessages = useMemo(() => {
    if (!sessionId) return 0;
    return messages.filter(m => m.toId === sessionId && !m.read).length;
  }, [messages, sessionId]);

  const ctx = {
    users, setUsers, currentUser, sessionId, setSessionId,
    likes, setLikes, matches, setMatches, messages, setMessages,
    reports, setReports, notifs, setNotifs, plans, setPlans,
    settings, setSettings,
    allProfiles, myMatchIds, myLikes, myPasses, myFavourites, likesMe,
    myNotifs, unreadNotifs, unreadMessages,
    navigate, showToast, register, login, logout, updateUser, deleteAccount,
    addNotif, markNotifsRead, likeProfile, undoLike, sendMessage,
    markConversationRead, reportProfile, blockProfile, signInAsDemo,
    route,
  };

  /* ── Render route ── */
  const path = route.replace(/^#/, '').split('?')[0];
  const parts = path.split('/').filter(Boolean);
  const page = parts[0] || 'home';
  const param = parts[1] || null;

  return (
    <AppCtx.Provider value={ctx}>
      <div className="min-h-screen bg-ivory font-sans">
        <TopNav page={page} />
        <main key={route} className="fade-in">
          {renderPage(page, param)}
        </main>
        <SiteFooter />
        <ToastHost toast={toast} />
        <CookieBanner />
      </div>
    </AppCtx.Provider>
  );
}

/* ═══════════════════════════════════════════════════════════════
   8. ROUTER DISPATCH
   ═══════════════════════════════════════════════════════════════ */

function renderPage(page, param) {
  switch (page) {
    case 'home':            return <HomePage />;
    case 'register':        return <RegisterPage />;
    case 'login':           return <LoginPage />;
    case 'forgot':          return <ForgotPasswordPage />;
    case 'setup':           return <ProfileSetupWizard />;
    case 'dashboard':       return <DashboardPage />;
    case 'discover':        return <DiscoverPage />;
    case 'profile':         return <ProfilePage id={param} />;
    case 'matches':         return <MatchesPage />;
    case 'likes':           return <LikesPage />;
    case 'favourites':      return <FavouritesPage />;
    case 'messages':        return <MessagesPage matchId={param} />;
    case 'membership':      return <MembershipPage />;
    case 'checkout':        return <CheckoutPage planId={param} />;
    case 'settings':        return <SettingsPage />;
    case 'privacy':         return <PrivacySettingsPage />;
    case 'verification':    return <VerificationPage />;
    case 'help':            return <HelpCentrePage />;
    case 'safety':          return <SafetyCentrePage />;
    case 'about':           return <AboutPage />;
    case 'contact':         return <ContactPage />;
    case 'legal-privacy':   return <LegalPage kind="privacy" />;
    case 'legal-terms':     return <LegalPage kind="terms" />;
    case 'legal-community': return <LegalPage kind="community" />;
    case 'legal-cookies':   return <LegalPage kind="cookies" />;
    case 'legal-responsible':return <LegalPage kind="responsible" />;
    case 'delete-account':  return <DeleteAccountPage />;
    case 'how-it-works':    return <HowItWorksPage />;
    case 'admin':           return <AdminPage />;
    default:                return <NotFoundPage />;
  }
}

/* ═══════════════════════════════════════════════════════════════
   9. NAVIGATION & FOOTER
   ═══════════════════════════════════════════════════════════════ */

function TopNav({ page }) {
  const { currentUser, navigate, logout, unreadMessages, unreadNotifs } = useApp();
  const [mobileOpen, setMobileOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => { setMobileOpen(false); setMenuOpen(false); }, [page]);

  const links = [
    { label:'Home', href:'#/' },
    { label:'Discover', href:'#/discover' },
    { label:'How It Works', href:'#/how-it-works' },
    { label:'Safety', href:'#/safety' },
    { label:'Membership', href:'#/membership' },
  ];

  const authLinks = currentUser ? [
    { label:'Dashboard', href:'#/dashboard' },
    { label:'Discover', href:'#/discover' },
    { label:'Matches', href:'#/matches' },
    { label:'Messages', href:'#/messages', badge:unreadMessages },
    { label:'Likes', href:'#/likes' },
  ] : [];

  return (
    <>
      <header className={`sticky top-0 z-50 transition-all duration-300 ${scrolled ? 'bg-ivory/92 backdrop-blur-lg shadow-soft' : 'bg-ivory/80 backdrop-blur'}`}>
        <div className="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8 h-16 sm:h-[68px]">
          <Logo onClick={() => navigate('#/')} />

          <nav className="hidden lg:flex items-center gap-1">
            {(currentUser ? authLinks : links).map(l => (
              <button key={l.href} onClick={() => navigate(l.href)}
                className={`relative rounded-full px-3.5 py-2 text-[13.5px] font-semibold transition ${'#'+page === l.href || ('#'+page) === l.href ? 'text-burgundy bg-burgundy/7' : 'text-charcoal-soft hover:text-burgundy hover:bg-burgundy/5'}`}>
                {l.label}
                {l.badge > 0 && (
                  <span className="absolute -right-0.5 -top-0.5 flex h-4.5 min-w-[18px] items-center justify-center rounded-full bg-burgundy px-1 text-[10px] font-bold text-white">
                    {l.badge > 9 ? '9+' : l.badge}
                  </span>
                )}
              </button>
            ))}
          </nav>

          <div className="flex items-center gap-2">
            {currentUser ? (
              <>
                <button onClick={() => navigate('#/messages')} className="relative hidden sm:flex rounded-full p-2.5 text-charcoal-soft hover:bg-burgundy/6" aria-label="Messages">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="1.9">
                    <path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.9-.9L3 21l1.9-5.1A8.4 8.4 0 014.5 11.5a8.4 8.4 0 018.5-8.4 8.4 8.4 0 018 8.4z" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                  {unreadMessages > 0 && <span className="absolute right-1 top-1 h-2.5 w-2.5 rounded-full bg-burgundy ring-2 ring-ivory" />}
                </button>

                <button onClick={() => navigate('#/dashboard')} className="relative hidden sm:flex rounded-full p-2.5 text-charcoal-soft hover:bg-burgundy/6" aria-label="Notifications">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="1.9">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0" strokeLinecap="round" strokeLinejoin="round"/>

function ToastHost({ toast }) {
  if (!toast) return null;
  const tones = {
    success: 'bg-white border-emerald-200 text-charcoal',
    match: 'bg-burgundy border-burgundy text-white',
    error: 'bg-white border-red-200 text-charcoal',
  };
  return (
    <div className="pointer-events-none fixed inset-x-0 bottom-5 z-[200] flex justify-center px-4">
      <div className={`pointer-events-auto flex items-center gap-3 rounded-2xl border px-4 py-3 shadow-lift pop ${tones[toast.tone] || tones.success}`}>
        {toast.tone === 'match' ? (
          <svg viewBox="0 0 24 24" className="h-5 w-5 text-rose" fill="currentColor"><path d="M12 21s-7.5-4.7-9.5-9.2C1 8.5 3 5 6.5 5c2 0 3.6 1.1 4.5 2.6.9-1.5 2.5-2.6 4.5-2.6C19 5 21 8.5 21.5 11.8 19.5 16.3 12 21 12 21z"/></svg>
        ) : (
          <svg viewBox="0 0 24 24" className="h-5 w-5 text-emerald-600" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        )}
        <p className="text-[13.5px] font-semibold">{toast.message}</p>
      </div>
    </div>
  );
}

function CookieBanner() {
  const [visible, setVisible] = useState(() => !localStorage.getItem('mytom.cookieConsent'));
  if (!visible) return null;
  const accept = (level) => { localStorage.setItem('mytom.cookieConsent', level); setVisible(false); };
  return (
    <div className="fixed inset-x-0 bottom-0 z-[90] border-t border-rose-soft bg-white/97 backdrop-blur px-4 py-4 shadow-lift">
      <div className="mx-auto flex max-w-7xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <p className="max-w-2xl text-[12.5px] leading-relaxed text-charcoal-soft">
          We use essential cookies to keep you signed in and to secure the platform. Optional analytics cookies help us improve MY TOM. You can change your choice at any time.
        </p>
        <div className="flex shrink-0 gap-2">
          <Button size="sm" variant="outline" onClick={() => accept('essential')}>Essential Only</Button>
          <Button size="sm" onClick={() => accept('all')}>Accept All</Button>

      </div>
    </div>
  );
}

/* ── Profile Card ── */
function ProfileCard({ profile, compact = false, showActions = false, onLike, onPass, onFav, liked, passed, faved }) {
  const { navigate, currentUser, likeProfile, showToast } = useApp();
  const [imgIdx, setImgIdx] = useState(0);
  const photos = profile.photos?.length ? profile.photos : null;
  const active = activeLabel(profile.lastActive);
  const { score, reasons } = currentUser ? compatibility(currentUser, profile) : { score:null, reasons:[] };

  const handleLike = (e) => {
    e.stopPropagation();
    if (!currentUser) { navigate('#/register'); return; }
    if (onLike) { onLike(); return; }
    const res = likeProfile(profile.id, 'like');
    if (res?.duplicate) showToast('You have already liked this profile.');
    else if (!res?.matched) showToast(`You liked ${profile.name}. We will let you know if they like you back.`);
  };

  return (
    <Card hover className="group overflow-hidden">
      <div className="relative aspect-[4/5] overflow-hidden" style={{ background: gradFor(profile.hue ?? 340) }}>
        {photos ? (
          <img src={photos[imgIdx]} alt={`${profile.name}'s profile photograph`} className="h-full w-full object-cover" loading="lazy" />
        ) : (
          <div className="flex h-full flex-col items-center justify-center">
            <Avatar name={profile.name} hue={profile.hue ?? 340} size={compact ? 78 : 96} ring />
          </div>
        )}

        <div className="absolute inset-x-0 top-0 flex items-start justify-between p-3.5">
          <div className="flex flex-wrap gap-1.5">
            {profile.demo && <Badge tone="gold" className="!bg-white/92 !text-[#7A5E20]">Demo profile</Badge>}
            {profile.verified && (
              <Badge tone="green" className="!bg-white/92">
                <VerifiedTick size={13} /> Verified
              </Badge>
            )}
            {profile.membership === 'vip' && <Badge tone="gold" className="!bg-white/92">★ VIP</Badge>}
          </div>
          {active && profile.privacy?.showOnline !== false && (
            <Badge tone={active.tone === 'green' ? 'green' : 'gold'} className="!bg-white/92">
              <span className={`h-1.5 w-1.5 rounded-full ${active.tone === 'green' ? 'bg-emerald-500' : 'bg-gold'}`} />
              {active.text}
            </Badge>
          )}
        </div>

        <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/72 via-black/25 to-transparent p-4 pt-14">
          <h3 className="font-display text-[21px] leading-tight text-white">
            {profile.name}{profile.privacy?.showAge !== false && <span className="text-white/85">, {profile.age}</span>}
          </h3>
          <p className="mt-0.5 flex items-center gap-1.5 text-[12.5px] text-white/80">
            <svg viewBox="0 0 24 24" className="h-3.5 w-3.5" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>
            </svg>
            {profile.city}, {profile.country}
          </p>
        </div>

        {score !== null && (
          <div className="absolute right-3.5 bottom-4">
            <span className="flex items-center gap-1.5 rounded-full bg-white/95 px-2.5 py-1 text-[11px] font-bold text-burgundy shadow">
              {score}% match
            </span>
          </div>
        )}
      </div>

      <div className="p-5">
        <p className="line-clamp-2 text-[13.5px] leading-relaxed text-charcoal-soft">{profile.bio}</p>

        {profile.interests?.length > 0 && (
          <div className="mt-3.5 flex flex-wrap gap-1.5">
            {profile.interests.slice(0, compact ? 2 : 3).map(i => (
              <span key={i} className="rounded-full bg-burgundy/7 px-2.5 py-1 text-[11px] font-medium text-burgundy">{i}</span>
            ))}
            {profile.interests.length > (compact ? 2 : 3) && (
              <span className="rounded-full bg-charcoal/5 px-2.5 py-1 text-[11px] font-medium text-charcoal-mute">
                +{profile.interests.length - (compact ? 2 : 3)}
              </span>
            )}
          </div>
        )}

        {!compact && reasons.length > 0 && (
          <div className="mt-4 rounded-xl bg-ivory px-3.5 py-3">
            <p className="text-[10.5px] font-bold uppercase tracking-wider text-gold">Why you may match</p>
            <ul className="mt-1.5 space-y-1">
              {reasons.slice(0,2).map(r => (
                <li key={r} className="flex items-start gap-1.5 text-[12px] text-charcoal-soft">
                  <span className="mt-1.5 h-1 w-1 shrink-0 rounded-full bg-gold" />{r}
                </li>
              ))}
            </ul>
          </div>
        )}

        <div className="mt-4 flex gap-2">
          {showActions ? (
            <>
              <Button size="sm" variant="soft" className="flex-1" onClick={handleLike} disabled={liked}>
                {liked ? 'Liked ♥' : 'Like'}
              </Button>
              <Button size="sm" variant="ghost" onClick={(e) => { e.stopPropagation(); onPass && onPass(); }} disabled={passed}>
                Pass
              </Button>
              <Button size="sm" variant="ghost" onClick={(e) => { e.stopPropagation(); onFav && onFav(); }} aria-label="Save to favourites">
                <svg viewBox="0 0 24 24" className={`h-4.5 w-4.5 ${faved ? 'text-gold' : ''}`} fill={faved ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.9">
                  <path d="M12 17.3l-5.4 2.8 1-6-4.4-4.3 6.1-.9L12 3.5l2.7 5.4 6.1.9-4.4 4.3 1 6z" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </Button>
              <Button size="sm" onClick={() => navigate('#/profile/' + profile.id)}>View</Button>
            </>
          ) : (
            <>
              <Button size="sm" variant="soft" className="flex-1" onClick={handleLike} disabled={liked}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill={liked ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.9">
                  <path d="M12 21s-7.5-4.7-9.5-9.2C1 8.5 3 5 6.5 5c2 0 3.6 1.1 4.5 2.6.9-1.5 2.5-2.6 4.5-2.6C19 5 21 8.5 21.5 11.8 19.5 16.3 12 21 12 21z"/>
                </svg>
                {liked ? 'Liked' : 'Like'}
              </Button>
              <Button size="sm" variant="outline" onClick={() => navigate('#/profile/' + profile.id)}>View Profile</Button>
            </>
          )}
        </div>
      </div>
    </Card>
  );
}

              <path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span className="text-[13.5px] leading-relaxed text-charcoal-soft">{f}</span>
          </li>
        ))}
      </ul>
      <Button
        className="mt-7 w-full" size="lg"
        variant={plan.popular ? 'primary' : 'outline'}

          if (!currentUser) { navigate('#/register'); return; }

  );
}

function RegisterPage() {
  const { register, navigate, showToast, settings } = useApp();
  const params = new URLSearchParams((window.location.hash.split('?')[1] || ''));
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    name:'', dob:'', email:'', password:'', confirm:'',
    gender: params.get('as') || '', interestedIn:'',
    country:'', city:'', goals:[],
    agree:false,
  });
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  const set = (k, v) => { setForm(f => ({ ...f, [k]: v })); setErrors(e => ({ ...e, [k]: undefined })); };

  const age = form.dob ? calcAge(form.dob) : null;

  const validateStep1 = () => {
    const e = {};
    if (!form.name.trim() || form.name.trim().length < 2) e.name = 'Please enter a display name (at least 2 characters).';
    if (!form.dob) e.dob = 'Please enter your date of birth.';
    else if (age === null) e.dob = 'Please enter a valid date of birth.';
    else if (age < 18) e.dob = 'You must be at least 18 years old to join MY TOM.';
    else if (age > 110) e.dob = 'Please enter a valid date of birth.';
    if (!form.email.trim()) e.email = 'Please enter your email address.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email)) e.email = 'Please enter a valid email address.';
    if (!form.password) e.password = 'Please create a password.';
    else if (form.password.length < 8) e.password = 'Password must be at least 8 characters.';
    if (form.password !== form.confirm) e.confirm = 'Passwords do not match.';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const validateStep2 = () => {
    const e = {};
    if (!form.gender) e.gender = 'Please select your gender.';
    if (!form.interestedIn) e.interestedIn = 'Please select who you are interested in.';
    if (!form.country) e.country = 'Please select your country.';
    if (!form.city.trim()) e.city = 'Please enter your city.';
    if (form.goals.length === 0) e.goals = 'Please choose at least one relationship goal.';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = () => {
    if (!form.agree) { setErrors({ agree:'You must agree to the Terms of Service and Privacy Policy.' }); return; }
    setBusy(true);
    setTimeout(() => {
      const res = register(form);
      setBusy(false);
      if (res.error) { setErrors({ form: res.error }); return; }
      setDone(true);
      showToast('Welcome to MY TOM. Please check your email to verify your address.');
    }, 500);
  };

  if (!settings.allowRegistrations) {
    return (
      <AuthShell title="Registrations are paused" subtitle="New sign-ups are temporarily closed while we perform maintenance. Please check back shortly.">
        <Button onClick={() => navigate('#/')}>Return to homepage</Button>
      </AuthShell>
    );
  }

  if (done) {
    return (
      <AuthShell title="Welcome to MY TOM" subtitle="Your account has been created. One quick step remains.">
        <Card className="p-6">
          <div className="flex items-start gap-3">
            <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-50">
              <svg viewBox="0 0 24 24" className="h-5 w-5 text-emerald-600" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </span>
            <div>
              <h3 className="font-semibold text-charcoal">Account created</h3>
              <p className="mt-1 text-[13.5px] leading-relaxed text-charcoal-soft">
                We have sent a verification link to <strong>{form.email}</strong>. In this prototype,
                email delivery is not configured — the account is active immediately.
              </p>
            </div>
          </div>
          <div className="mt-5 rounded-xl bg-ivory p-4">
            <p className="text-[12px] font-bold uppercase tracking-wider text-gold">Production setup required</p>
            <p className="mt-1.5 text-[12.5px] leading-relaxed text-charcoal-soft">
              Connect an email provider (Supabase Auth, Resend, SendGrid, or Firebase Auth) and set the
              verification redirect URL to complete email verification.
            </p>
          </div>
          <Button className="mt-6 w-full" size="lg" onClick={() => navigate('#/setup')}>
            Continue to profile setup
          </Button>
        </Card>
      </AuthShell>
    );
  }

  return (
    <AuthShell
      title="Create your free account"
      subtitle="It takes about two minutes. You must be 18 or over to join MY TOM."
      side={
        <div>
          <p className="text-[11.5px] font-bold uppercase tracking-[0.16em] text-gold">Join MY TOM</p>
          <h2 className="mt-4 font-display text-[34px] leading-tight text-white">{BRAND.tagline}</h2>
          <ul className="mt-8 space-y-4">
            {[
              'Free to join — no card required',
              'You control who sees your profile',
              'Only mutual matches can message you',
              'Verified profiles and active moderation',
            ].map(t => (
              <li key={t} className="flex items-start gap-3">
                <span className="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-white/15">
                  <svg viewBox="0 0 24 24" className="h-3 w-3 text-gold" fill="none" stroke="currentColor" strokeWidth="3"><path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </span>
                <span className="text-[14px] text-white/85">{t}</span>
              </li>
            ))}
          </ul>
          <div className="mt-10 rounded-2xl border border-white/15 bg-white/8 p-5">
            <p className="text-[12.5px] leading-relaxed text-white/75">
              MY TOM is for adults aged 18 and over. We do not permit minors, coercion,
              harassment, or commercial sexual services of any kind.
            </p>
          </div>
        </div>
      }
    >
      {/* Progress */}
      <div className="mb-7 flex items-center gap-2">
        {[1,2].map(n => (
          <React.Fragment key={n}>
            <div className={`flex h-7 w-7 items-center justify-center rounded-full text-[12px] font-bold transition ${step >= n ? 'bg-burgundy text-white' : 'bg-charcoal/8 text-charcoal-mute'}`}>{n}</div>
            {n === 1 && <div className={`h-0.5 flex-1 rounded ${step > 1 ? 'bg-burgundy' : 'bg-charcoal/10'}`} />}
          </React.Fragment>
        ))}
        <span className="ml-2 text-[12px] font-semibold text-charcoal-mute">Step {step} of 2</span>
      </div>

      {errors.form && (
        <div className="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3">
          <p className="text-[13px] font-medium text-red-700">{errors.form}</p>
        </div>
      )}

      {step === 1 && (
        <div className="space-y-4">
          <Input label="First name or display name" placeholder="How you'd like to be known"
            value={form.name} onChange={e => set('name', e.target.value)} error={errors.name} maxLength={40} />

          <div>
            <Input label="Date of birth" type="date" value={form.dob}
              onChange={e => set('dob', e.target.value)} error={errors.dob}
              hint={age !== null && age >= 18 ? `You are ${age} years old.` : 'You must be 18 or over to use MY TOM.'} />
          </div>

          <Input label="Email address" type="email" placeholder="you@example.com"
            value={form.email} onChange={e => set('email', e.target.value)} error={errors.email} autoComplete="email" />

          <Input label="Password" type="password" placeholder="At least 8 characters"
            value={form.password} onChange={e => set('password', e.target.value)} error={errors.password} autoComplete="new-password" />

          <Input label="Confirm password" type="password" placeholder="Re-enter your password"
            value={form.confirm} onChange={e => set('confirm', e.target.value)} error={errors.confirm} autoComplete="new-password" />

          <div className="rounded-xl bg-ivory px-4 py-3">

        <div className="space-y-4">
          <div>
            <span className="mb-1.5 block text-[13px] font-semibold text-charcoal">I am a</span>
            <div className="grid grid-cols-2 gap-2.5">
              {[{ v:'woman', l:'Woman' }, { v:'man', l:'Man' }].map(o => (
                <button key={o.v} type="button" onClick={() => set('gender', o.v)}
                  className={`rounded-xl border px-4 py-3 text-[14px] font-semibold transition ${form.gender === o.v ? 'border-burgundy bg-burgundy/8 text-burgundy' : 'border-rose-soft bg-white text-charcoal-soft hover:border-burgundy/40'}`}>

            {errors.gender && <p className="mt-1 text-[12px] font-medium text-red-600">{errors.gender}</p>}

          <div>
            <span className="mb-1.5 block text-[13px] font-semibold text-charcoal">I am interested in</span>
            <div className="grid grid-cols-3 gap-2.5">
              {[{ v:'man', l:'Men' }, { v:'woman', l:'Women' }, { v:'both', l:'Everyone' }].map(o => (
                <button key={o.v} type="button" onClick={() => set('interestedIn', o.v)}
                  className={`rounded-xl border px-3 py-3 text-[13.5px] font-semibold transition ${form.interestedIn === o.v ? 'border-burgundy bg-burgundy/8 text-burgundy' : 'border-rose-soft bg-white text-charcoal-soft hover:border-burgundy/40'}`}>
                  {o.l}
                </button>
              ))}
            </div>
            {errors.interestedIn && <p className="mt-1 text-[12px] font-medium text-red-600">{errors.interestedIn}</p>}

          <Select label="Country" value={form.country} onChange={e => set('country', e.target.value)} error={errors.country}>
            <option value="">Select your country</option>

          <Input label="City" placeholder="e.g. London" value={form.city}
            onChange={e => set('city', e.target.value)} error={errors.city}

          <div>
            <span className="mb-1.5 block text-[13px] font-semibold text-charcoal">What are you looking for?</span>
            <p className="mb-3 text-[12px] text-charcoal-mute">Choose all that apply. You can change this at any time.</p>
            <div className="flex flex-wrap gap-2">
              {GOALS.map(g => {
                const on = form.goals.includes(g);
                return (
                  <button key={g} type="button"
                    onClick={() => set('goals', on ? form.goals.filter(x => x !== g) : [...form.goals, g])}
                    className={`rounded-full border px-3.5 py-2 text-[12.5px] font-medium transition ${on ? 'border-burgundy bg-burgundy text-white' : 'border-rose-soft bg-white text-charcoal-soft hover:border-burgundy/40'}`}>
                    {g}

                );

            </div>
            {errors.goals && <p className="mt-2 text-[12px] font-medium text-red-600">{errors.goals}</p>}
          </div>

          <label className="flex items-start gap-3 rounded-xl bg-ivory px-4 py-3.5">
            <input type="checkbox" checked={form.agree} onChange={e => set('agree', e.target.checked)}
              className="mt-0.5 h-4.5 w-4.5 shrink-0 rounded border-rose-soft text-burgundy focus:ring-burgundy" />
            <span className="text-[12.5px] leading-relaxed text-charcoal-soft">
              I confirm I am 18 years or older and I agree to the{' '}
              <button type="button" onClick={() => navigate('#/legal-terms')} className="font-semibold text-burgundy underline">Terms of Service</button> and{' '}
              <button type="button" onClick={() => navigate('#/legal-privacy')} className="font-semibold text-burgundy underline">Privacy Policy</button>.
            </span>
          </label>
          {errors.agree && <p className="text-[12px] font-medium text-red-600">{errors.agree}</p>}

          <div className="flex gap-2.5 pt-1">
            <Button variant="outline" size="lg" onClick={() => setStep(1)}>Back</Button>
            <Button size="lg" className="flex-1" disabled={busy} onClick={submit}>
              {busy ? 'Creating your account…' : 'Create Free Account'}
            </Button>
          </div>
        </div>
      )}
    </AuthShell>
  );
}

function LoginPage() {

          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.76c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/>

/* ═══════════════════════════════════════════════════════════════
   13. PROFILE SETUP WIZARD
   ═══════════════════════════════════════════════════════════════ */

function ProfileSetupWizard() {
  const { currentUser, updateUser, navigate, showToast } = useApp();
  const [step, setStep] = useState(1);
  const fileRef = useRef(null);

  const [form, setForm] = useState(() => ({
    bio: currentUser?.bio || '',
    occupation: currentUser?.occupation || '',
    interests: currentUser?.interests || [],
    goals: currentUser?.goals || [],
    prefAgeMin: currentUser?.prefAgeMin ?? (currentUser?.gender === 'woman' ? 21 : 30),
    prefAgeMax: currentUser?.prefAgeMax ?? (currentUser?.gender === 'woman' ? 40 : 60),
    photos: currentUser?.photos || [],
    expectNote: currentUser?.expectNote || '',
    lifestyle: currentUser?.lifestyle || '',
    commStyle: currentUser?.commStyle || '',
  }));

  useEffect(() => { if (!currentUser) navigate('#/login'); }, [currentUser, navigate]);
  if (!currentUser) return null;

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleUpload = (e) => {
    const files = Array.from(e.target.files || []);
    const max = currentUser.membership === 'free' ? 3 : 8;
    const remaining = max - form.photos.length;
    if (remaining <= 0) { showToast(`Your plan allows up to ${max} photographs.`, 'error'); return; }

    files.slice(0, remaining).forEach(file => {
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) { showToast('Only JPEG, PNG, WebP, or GIF images are allowed.', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { showToast('Images must be smaller than 5MB.', 'error'); return; }
      const reader = new FileReader();
      reader.onload = ev => setForm(f => ({ ...f, photos: [...f.photos, ev.target.result] }));
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

  const finish = () => {
    updateUser({ ...form, profileComplete: true });
    showToast('Your profile is live. Welcome to MY TOM.');
    navigate('#/discover');
  };

  const steps = ['Photographs', 'About you', 'Interests', 'What you want'];

  return (
    <div className="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-14">
      <div className="text-center">
        <p className="text-[11.5px] font-bold uppercase tracking-[0.16em] text-gold">Profile setup</p>
        <h1 className="mt-3 font-display text-[30px] leading-tight text-burgundy sm:text-[38px]">Let's build your profile</h1>
        <p className="mt-3 text-[14.5px] text-charcoal-soft">A complete, honest profile gets far better matches.</p>
      </div>

      <div className="mt-9 flex items-center justify-center gap-2">
        {steps.map((s, i) => (
          <React.Fragment key={s}>
            <div className="flex flex-col items-center gap-1.5">
              <div className={`flex h-8 w-8 items-center justify-center rounded-full text-[12px] font-bold transition ${step > i ? 'bg-burgundy text-white' : step === i+1 ? 'bg-burgundy text-white ring-4 ring-burgundy/15' : 'bg-charcoal/8 text-charcoal-mute'}`}>
                {step > i+1 ? '✓' : i+1}
              </div>
              <span className="hidden text-[11px] font-semibold text-charcoal-mute sm:block">{s}</span>
            </div>
            {i < steps.length - 1 && <div className={`h-0.5 w-8 rounded sm:w-14 ${step > i+1 ? 'bg-burgundy' : 'bg-charcoal/10'}`} />}
          </React.Fragment>
        ))}
      </div>

      <Card className="mt-8 p-6 sm:p-8">
        {step === 1 && (
          <div>
            <h2 className="font-display text-[22px] text-burgundy">Add your photographs</h2>
            <p className="mt-2 text-[13.5px] leading-relaxed text-charcoal-soft">
              Your first photograph becomes your main profile picture. Clear, recent photographs of your face work best.
              {currentUser.membership === 'free' && ' Free members can upload up to 3 photographs.'}
            </p>

            <div className="mt-6 grid grid-cols-3 gap-3 sm:grid-cols-4">
              {form.photos.map((p, i) => (
                <div key={i} className="group relative aspect-[3/4] overflow-hidden rounded-xl border border-rose-soft">
                  <img src={p} alt={`Profile photograph ${i+1}`} className="h-full w-full object-cover" />
                  {i === 0 && <span className="absolute left-1.5 top-1.5 rounded-full bg-burgundy px-2 py-0.5 text-[9.5px] font-bold text-white">MAIN</span>}
                  <div className="absolute inset-x-0 bottom-0 flex justify-center gap-1 bg-black/55 py-1.5 opacity-0 transition group-hover:opacity-100">
                    {i > 0 && (
                      <button onClick={() => setForm(f => {
                        const arr = [...f.photos]; [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; return { ...f, photos: arr };
                      })} className="rounded px-1.5 py-0.5 text-[10px] font-semibold text-white hover:bg-white/20">←</button>
                    )}
                    <button onClick={() => setForm(f => ({ ...f, photos: f.photos.filter((_, j) => j !== i) }))}
                      className="rounded px-1.5 py-0.5 text-[10px] font-semibold text-white hover:bg-white/20">Remove</button>
                  </div>
                </div>
              ))}
              <button onClick={() => fileRef.current?.click()}
                className="flex aspect-[3/4] flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-rose-soft text-charcoal-mute transition hover:border-burgundy hover:bg-burgundy/4">
                <svg viewBox="0 0 24 24" className="h-6 w-6" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 5v14M5 12h14" strokeLinecap="round"/></svg>
                <span className="text-[11.5px] font-semibold">Add photo</span>
              </button>
            </div>
            <input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden onChange={handleUpload} />

            <div className="mt-5 rounded-xl bg-ivory px-4 py-3">
              <p className="text-[12px] leading-relaxed text-charcoal-mute">
                <strong className="font-semibold text-charcoal">Image safety:</strong> uploads are validated for type and size.
                In production, images are scanned and stored in Supabase Storage / Firebase Storage / Cloudinary with
                signed URLs — never served from an unvalidated public bucket.
              </p>
            </div>
          </div>
        )}

        {step === 2 && (
          <div className="space-y-5">
            <div>
              <h2 className="font-display text-[22px] text-burgundy">About you</h2>
              <p className="mt-2 text-[13.5px] leading-relaxed text-charcoal-soft">
                Write as yourself. Specific details are far more attractive than generic lines.
              </p>
            </div>
            <Textarea label="Short biography" rows={5} maxLength={500}
              placeholder="e.g. Interior designer, mother of two grown children, and a hopeless optimist about people. I like long dinners and coastal walks."
              value={form.bio} onChange={e => set('bio', e.target.value)}
              hint={`${form.bio.length}/500 characters`} />
            <Input label="Occupation (optional)" placeholder="e.g. Architect"
              value={form.occupation} onChange={e => set('occupation', e.target.value)} />
            <div className="grid gap-4 sm:grid-cols-2">
              <Input label="Preferred partner age — minimum" type="number" min="18" max="99"
                value={form.prefAgeMin} onChange={e => set('prefAgeMin', Math.max(18, +e.target.value || 18))} />
              <Input label="Preferred partner age — maximum" type="number" min="18" max="99"
                value={form.prefAgeMax} onChange={e => set('prefAgeMax', Math.min(99, +e.target.value || 99))} />
            </div>
            <Select label="Preferred communication style" value={form.commStyle} onChange={e => set('commStyle', e.target.value)}>
              <option value="">No preference</option>
              <option>Frequent, short messages</option>
              <option>Longer, thoughtful messages</option>
              <option>Voice notes and calls</option>
              <option>Meet in person fairly quickly</option>
            </Select>
            <Select label="Lifestyle preference" value={form.lifestyle} onChange={e => set('lifestyle', e.target.value)}>
              <option value="">No preference</option>
              <option>Quiet and home-centred</option>
              <option>Social and outgoing</option>
              <option>Active and outdoorsy</option>
              <option>Culturally focused</option>
            </Select>
          </div>
        )}

        {step === 3 && (
          <div>
            <h2 className="font-display text-[22px] text-burgundy">Your interests</h2>
            <p className="mt-2 text-[13.5px] leading-relaxed text-charcoal-soft">
              Choose at least three. Shared interests are the strongest driver of compatibility on MY TOM.
            </p>
            <div className="mt-6 flex flex-wrap gap-2">
              {INTERESTS.map(i => {
                const on = form.interests.includes(i);
                return (
                  <button key={i} type="button"
                    onClick={() => set('interests', on ? form.interests.filter(x => x !== i) : [...form.interests, i])}
                    className={`rounded-full border px-3.5 py-2 text-[12.5px] font-medium transition ${on ? 'border-burgundy bg-burgundy text-white' : 'border-rose-soft bg-white text-charcoal-soft hover:border-burgundy/40'}`}>
                    {i}
                  </button>
                );
              })}
            </div>
            <p className="mt-4 text-[12.5px] text-charcoal-mute">{form.interests.length} selected</p>
          </div>
        )}

        {step === 4 && (
          <div className="space-y-5">
            <div>
              <h2 className="font-display text-[22px] text-burgundy">What you are looking for</h2>
              <p className="mt-2 text-[13.5px] leading-relaxed text-charcoal-soft">
                Be honest here. Clear expectations lead to far better matches — and far fewer disappointments.
              </p>
            </div>

            <div className="flex flex-wrap gap-2">
              {GOALS.map(g => {
                const on = form.goals.includes(g);
                return (
                  <button key={g} type="button"
                    onClick={() => set('goals', on ? form.goals.filter(x => x !== g) : [...form.goals, g])}
                    className={`rounded-full border px-3.5 py-2 text-[12.5px] font-medium transition ${on ? 'border-burgundy bg-burgundy text-white' : 'border-rose-soft bg-white text-charcoal-soft hover:border-burgundy/40'}`}>
                    {g}
                  </button>
                );
              })}
            </div>

            {(form.goals.includes('Generous Dating') || form.goals.includes('Mutually Beneficial Relationship') || form.goals.includes('Lifestyle Compatibility')) && (
              <div className="rounded-2xl border border-gold/40 bg-gold/6 p-5">
                <h3 className="text-[13.5px] font-bold text-[#7A5E20]">Relationship Expectations</h3>
                <p className="mt-2 text-[12.5px] leading-relaxed text-[#7A5E20]/90">
                  If your relationship involves financial generosity, gifts, or lifestyle support, describe it
                  honestly and respectfully. On MY TOM, participation must always be voluntary. Coercion, threats,
                  blackmail, deceptive promises, fraudulent payment requests, trafficking, exploitation, and
                  commercial sexual services are strictly prohibited.
                </p>
                <Textarea className="mt-4" rows={3} maxLength={300}
                  placeholder="Describe your expectations honestly and respectfully (optional)."
                  value={form.expectNote} onChange={e => set('expectNote', e.target.value)} />
              </div>
            )}

            <div className="rounded-xl bg-ivory px-4 py-3.5">
              <p className="text-[12px] leading-relaxed text-charcoal-mute">
                MY TOM does not assume that mature women are wealthy or that younger men are seeking financial support.
                Every member decides for themselves what they want.
              </p>
            </div>
          </div>
        )}

        <div className="mt-8 flex gap-2.5 border-t border-rose-soft/70 pt-6">
          {step > 1 && <Button variant="outline" size="lg" onClick={() => setStep(s => s - 1)}>Back</Button>}
          {step < 4 ? (
            <Button size="lg" className="flex-1" onClick={() => setStep(s => s + 1)}>Continue</Button>
          ) : (
            <Button size="lg" className="flex-1" onClick={finish}>Publish my profile</Button>
          )}
          <Button variant="ghost" size="lg" onClick={finish}>Skip for now</Button>
        </div>
      </Card>
    </div>
  );
}

function DiscoverPage() {
  const app = useApp();
  const { currentUser, allProfiles, navigate, myLikes, myPasses, myFavourites, likeProfile, undoLike, showToast, settings } = app;

  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sort, setSort] = useState('compatibility');
  const [f, setF] = useState({
    minAge: 18, maxAge: 70, country:'', city:'', goals:[], interests:[],
    verifiedOnly:false, activeOnly:false, gender:'',
    excludeLiked:false,
  });

  useEffect(() => { if (!currentUser) navigate('#/register'); }, [currentUser, navigate]);
  useEffect(() => { if (currentUser) { /* personalise default age range */ } }, [currentUser]);

  const blocked = currentUser?.blocked || [];

  const results = useMemo(() => {
    if (!currentUser) return [];
    let list = allProfiles.filter(p => !blocked.includes(p.id));

    // Show people whose gender matches the user's preference and vice versa
    const wantGender = currentUser.interestedIn === 'both' ? null : currentUser.interestedIn;
    if (wantGender) list = list.filter(p => p.gender === wantGender);
    if (f.gender) list = list.filter(p => p.gender === f.gender);

    list = list.filter(p => p.age >= f.minAge && p.age <= f.maxAge);
    if (f.country) list = list.filter(p => p.country === f.country);
    if (f.city) list = list.filter(p => p.city.toLowerCase().includes(f.city.toLowerCase()));
    if (f.verifiedOnly) list = list.filter(p => p.verified);
    if (f.activeOnly) list = list.filter(p => (p.lastActive ?? 999) <= 48);
    if (f.goals.length) list = list.filter(p => p.goals?.some(g => f.goals.includes(g)));
    if (f.interests.length) list = list.filter(p => p.interests?.some(i => f.interests.includes(i)));
    if (f.excludeLiked) list = list.filter(p => !myLikes.includes(p.id));

    // Respect privacy: hide profiles that opted out of Discover
    list = list.filter(p => p.demo || p.privacy?.showInDiscover !== false);
    if (currentUser.privacy?.hideFromSearch) { /* users can hide themselves; doesn't affect their own browsing */ }

    const scored = list.map(p => ({ p, ...compatibility(currentUser, p) }));
    if (sort === 'compatibility') scored.sort((a,b) => b.score - a.score);
    if (sort === 'recent') scored.sort((a,b) => (a.p.lastActive ?? 999) - (b.p.lastActive ?? 999));
    if (sort === 'age-asc') scored.sort((a,b) => a.p.age - b.p.age);
    if (sort === 'age-desc') scored.sort((a,b) => b.p.age - a.p.age);

    return scored;
  }, [allProfiles, currentUser, f, sort, myLikes, blocked]);

  const activeFilterCount = [
    f.country, f.city, f.gender, f.verifiedOnly, f.activeOnly, f.excludeLiked,
  ].filter(Boolean).length + f.goals.length + f.interests.length +
    ((f.minAge !== 18 || f.maxAge !== 70) ? 1 : 0);

  const reset = () => setF({ minAge:18, maxAge:70, country:'', city:'', goals:[], interests:[], verifiedOnly:false, activeOnly:false, gender:'', excludeLiked:false });

  if (!currentUser) {
    return (
      <div className="mx-auto max-w-lg px-4 py-20 text-center">
        <h1 className="font-display text-[30px] text-burgundy">Sign in to discover members</h1>
        <p className="mt-3 text-[14.5px] text-charcoal-soft">Create a free account to browse compatible profiles and start matching.</p>
        <div className="mt-7 flex justify-center gap-3">
          <Button onClick={() => navigate('#/register')}>Create Free Account</Button>
          <Button variant="outline" onClick={() => navigate('#/login')}>Log In</Button>
        </div>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-10 lg:px-8">
      <div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p className="text-[11.5px] font-bold uppercase tracking-[0.16em] text-gold">Discover</p>
          <h1 className="mt-2.5 font-display text-[30px] leading-tight text-burgundy sm:text-[38px]">Find your match</h1>
          <p className="mt-2.5 text-[14.5px] text-charcoal-soft">
            {results.length} {results.length === 1 ? 'member' : 'members'} match your current criteria.
          </p>
        </div>
        <div className="flex gap-2.5">
          <Button variant="outline" onClick={() => setFiltersOpen(v => !v)}>
            <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M7 12h10M10 18h4" strokeLinecap="round"/></svg>
            Filters{activeFilterCount > 0 ? ` (${activeFilterCount})` : ''}
          </Button>
          <Select value={sort} onChange={e => setSort(e.target.value)} className="!w-auto !py-2.5">
            <option value="compatibility">Best match</option>
            <option value="recent">Recently active</option>
            <option value="age-asc">Age: youngest first</option>
            <option value="age-desc">Age: oldest first</option>
          </Select>
        </div>
      </div>

      <DemoNotice className="mt-7" />

      <div className="mt-6 grid gap-7 lg:grid-cols-[290px_1fr]">
        {/* Filters panel */}
        <aside className={`${filtersOpen ? 'block' : 'hidden'} lg:block`}>
          <Card className="sticky top-24 p-5">
            <div className="flex items-center justify-between">
              <h2 className="font-display text-[18px] text-burgundy">Filters</h2>
              <button onClick={reset} className="text-[12px] font-semibold text-burgundy hover:underline">Reset</button>
            </div>

            <div className="mt-5 space-y-5">
              <div>
                <span className="mb-2 block text-[12.5px] font-bold text-charcoal">Age range</span>
                <div className="flex items-center gap-2">
                  <input type="number" min="18" max="99" value={f.minAge}
                    onChange={e => setF(s => ({ ...s, minAge: Math.max(18, +e.target.value || 18) }))}
                    className="w-full rounded-lg border border-rose-soft px-3 py-2 text-[13px] focus:border-burgundy" />
                  <span className="text-charcoal-mute">–</span>
                  <input type="number" min="18" max="99" value={f.maxAge}
                    onChange={e => setF(s => ({ ...s, maxAge: Math.min(99, +e.target.value || 99) }))}
                    className="w-full rounded-lg border border-rose-soft px-3 py-2 text-[13px] focus:border-burgundy" />
                </div>
              </div>

              <Select label="Show me" value={f.gender} onChange={e => setF(s => ({ ...s, gender: e.target.value }))}>
                <option value="">Everyone in my preferences</option>
                <option value="woman">Women</option>
                <option value="man">Men</option>
              </Select>

              <Select label="Country" value={f.country} onChange={e => setF(s => ({ ...s, country: e.target.value }))}>
                <option value="">Any country</option>
                {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
              </Select>

              <Input label="City" placeholder="Any city" value={f.city}
                onChange={e => setF(s => ({ ...s, city: e.target.value }))} />

              <div>
                <span className="mb-2 block text-[12.5px] font-bold text-charcoal">Relationship goals</span>
                <div className="flex flex-wrap gap-1.5">
                  {GOALS.map(g => {
                    const on = f.goals.includes(g);
                    return (
                      <button key={g} onClick={() => setF(s => ({ ...s, goals: on ? s.goals.filter(x => x !== g) : [...s.goals, g] }))}
                        className={`rounded-full border px-2.5 py-1.5 text-[11px] font-medium transition ${on ? 'border-burgundy bg-burgundy text-white' : 'border-rose-soft text-charcoal-soft hover:border-burgundy/40'}`}>
                        {g}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <span className="mb-2 block text-[12.5px] font-bold text-charcoal">Shared interests</span>
                <div className="flex max-h-44 flex-wrap gap-1.5 overflow-y-auto pr-1">
                  {INTERESTS.slice(0, 18).map(i => {
                    const on = f.interests.includes(i);
                    return (
                      <button key={i} onClick={() => setF(s => ({ ...s, interests: on ? s.interests.filter(x => x !== i) : [...s.interests, i] }))}
                        className={`rounded-full border px-2.5 py-1.5 text-[11px] font-medium transition ${on ? 'border-burgundy bg-burgundy text-white' : 'border-rose-soft text-charcoal-soft hover:border-burgundy/40'}`}>
                        {i}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="border-t border-rose-soft/70 pt-2">
                <Toggle checked={f.verifiedOnly} onChange={v => setF(s => ({ ...s, verifiedOnly:v }))}
                  label="Verified profiles only" description="Show only members who have completed verification." />
                <Toggle checked={f.activeOnly} onChange={v => setF(s => ({ ...s, activeOnly:v }))}
                  label="Recently active" description="Members who were active in the last 48 hours." />
                <Toggle checked={f.excludeLiked} onChange={v => setF(s => ({ ...s, excludeLiked:v }))}
                  label="Hide profiles I've liked" description="Remove people you have already liked or passed on." />
              </div>

              <div className="rounded-xl bg-ivory p-3.5">
                <p className="text-[11.5px] leading-relaxed text-charcoal-mute">
                  MY TOM never reveals a member's exact location. We show city and country only.
                </p>
              </div>
            </div>
          </Card>
        </aside>

        {/* Results */}
        <div>
          {results.length === 0 ? (
            <Card className="p-10">
              <EmptyState title="No members match those filters"
                body="Try widening your age range, removing a filter, or searching a different city."
                cta="Reset filters" onClick={reset} />
            </Card>
          ) : (
            <>
              <div className="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
                {results.map(({ p, score, reasons }) => (
                  <ProfileCardWithScore key={p.id} profile={p} score={score} reasons={reasons} />
                ))}
              </div>

              <div className="mt-10 flex flex-col items-center gap-3">
                <p className="text-[12.5px] text-charcoal-mute">
                  Showing {results.length} of {allProfiles.length} members
                </p>
                <p className="max-w-md text-center text-[11.5px] leading-relaxed text-charcoal-mute">
                  In production, results load in paginated batches of 24 with cursor-based pagination
                  and are filtered server-side using row-level security policies.
                </p>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function ProfileCardWithScore({ profile, score, reasons }) {
  const { currentUser, navigate, myLikes, myPasses, myFavourites, likeProfile, undoLike, showToast } = useApp();
  const liked = myLikes.includes(profile.id);
  const passed = myPasses.includes(profile.id);
  const faved = myFavourites.includes(profile.id);

  return (
    <div className="flex flex-col">
      <ProfileCard profile={profile} showActions
        liked={liked} passed={passed} faved={faved}
        onLike={() => {
          if (liked) { undoLike(profile.id); showToast('Like removed.'); return; }
          const res = likeProfile(profile.id, 'like');
          if (res?.duplicate) showToast('You have already liked this profile.');
        }}
        onPass={() => { likeProfile(profile.id, 'pass'); showToast(`Passed on ${profile.name}.`); }}
        onFav={() => {
          likeProfile(profile.id, faved ? 'pass' : 'favorite');
          showToast(faved ? 'Removed from favourites.' : 'Saved to favourites.');
        }} />
      {reasons?.length > 0 && (
        <div className="mt-3 rounded-2xl border border-rose-soft/70 bg-white px-4 py-3.5">
          <div className="flex items-center justify-between">
            <p className="text-[10.5px] font-bold uppercase tracking-wider text-gold">Compatibility</p>
            <span className="font-display text-[18px] text-burgundy">{score}%</span>
          </div>
          <div className="mt-2 h-1.5 overflow-hidden rounded-full bg-rose-soft/50">
            <div className="h-full rounded-full bg-burgundy transition-all" style={{ width: score + '%' }} />
          </div>
          <ul className="mt-3 space-y-1">
            {reasons.slice(0, 2).map(r => (
              <li key={r} className="flex items-start gap-1.5 text-[11.5px] text-charcoal-mute">
                <span className="mt-1.5 h-1 w-1 shrink-0 rounded-full bg-gold" />{r}
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

function MatchesPage() {
  const { currentUser, navigate, myMatchIds, allProfiles, messages, sessionId } = useApp();
  useEffect(() => { if (!currentUser) navigate('#/login'); }, [currentUser, navigate]);
  if (!currentUser) return null;

  const withProfiles = myMatchIds.map(m => ({ ...m, profile: allProfiles.find(p => p.id === m.otherId) })).filter(x => x.profile);

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10 lg:px-8">
      <p className="text-[11.5px] font-bold uppercase tracking-[0.16em] text-gold">Connections</p>
      <h1 className="mt-2.5 font-display text-[30px] leading-tight text-burgundy sm:text-[38px]">Your matches</h1>
      <p className="mt-2.5 text-[14.5px] text-charcoal-soft">
        {withProfiles.length === 0 ? 'You have no matches yet.' : `${withProfiles.length} mutual ${withProfiles.length === 1 ? 'match' : 'matches'}. You can message anyone here.`}
      </p>

      {withProfiles.length === 0 ? (
        <Card className="mt-8 p-10">
          <EmptyState title="No matches yet"
            body="When you and another member both like each other, a match is created and you can start a conversation."
            cta="Discover members" onClick={() => navigate('#/discover')} />
        </Card>
      ) : (
        <div className="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
          {withProfiles.map(m => {
            const conv = messages.filter(x => x.matchId === m.matchId);
            const last = conv[conv.length - 1];
            const unread = conv.filter(x => x.toId === sessionId && !x.read).length;
            return (
              <Card key={m.matchId} hover className="overflow-hidden">
                <div className="relative aspect-[5/4] cursor-pointer" onClick={() => navigate('#/messages/' + m.matchId)}

                    <div className="flex h-full items-center justify-center">
                      <Avatar name={m.profile.name} hue={m.profile.hue} size={92} ring />

                  )}
                  <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-4 pt-12">
                    <p className="font-display text-[19px] text-white">

                </div>
              </Card>
